worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ---------------------------------------------------------------------------
  # Docker's embedded DNS server is always at 127.0.0.11 inside a user-defined
  # network. Every service NAME (backend, postgres, redis) is a DNS record that
  # resolves to the container IP(s). This is how containers find each other -
  # no hardcoded IPs, ever.
  #
  # `valid=5s` tells nginx to re-resolve names every 5 seconds. Combined with a
  # VARIABLE in proxy_pass below, this means: scale the backend and nginx picks
  # up the new containers on its own, no restart required.
  # ---------------------------------------------------------------------------
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Send logs to stdout/stderr so `docker compose logs nginx` shows them.
  # (Containers should log to the stream, not to files inside the container.)
  log_format main '$remote_addr - "$request" -> $upstream_addr [$status]';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  server {
    listen 80;

    location / {
      # The variable forces runtime DNS resolution (see `resolver` above), so
      # nginx load-balances across every IP the name `backend` returns - i.e.
      # across all your scaled replicas, round-robin.
      set $backend_upstream "backend:3000";
      proxy_pass http://$backend_upstream;

      proxy_http_version 1.1;
      proxy_set_header Connection "";          # enable keepalive to upstream
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Tiny timeouts so a dead replica fails over fast during a demo.
      proxy_connect_timeout 3s;
      proxy_read_timeout    30s;
    }

    # Nginx's own liveness endpoint (does NOT touch the backend).
    location = /nginx-health {
      return 200 'nginx ok\n';
      add_header Content-Type text/plain;
    }
  }
}

# -----------------------------------------------------------------------------
# ALTERNATIVE (classic) approach - swap the location block above for this if you
# prefer a static upstream. It is very slightly faster (resolution at startup,
# real keepalive pool) but requires `docker compose restart nginx` after you
# scale the backend, because the replica IPs are captured when nginx boots:
#
#   upstream backend_pool {
#     server backend:3000 max_fails=2 fail_timeout=5s;
#     keepalive 32;
